<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Denis Martín Barroso</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07131d;
      --bg-2: #0d1f2d;
      --panel: rgba(11, 27, 40, 0.86);
      --panel-border: rgba(132, 164, 196, 0.14);
      --text: #edf5fb;
      --muted: #9db0c2;
      --accent: #2ee6a6;
      --accent-2: #65c7ff;
      --danger: #ff8f8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(46,230,166,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(101,199,255,0.18), transparent 24%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-shell {
      width: min(100%, 460px);
      padding: 30px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 26px 70px rgba(0,0,0,0.38);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }
    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    h1 {
      margin: 16px 0 10px;
      font-size: clamp(32px, 8vw, 44px);
      letter-spacing: -0.05em;
      line-height: 0.98;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    form {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      outline: none;
      font: inherit;
    }
    input:focus {
      border-color: rgba(101,199,255,0.58);
      box-shadow: 0 0 0 4px rgba(101,199,255,0.12);
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #052033;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(46,230,166,0.24);
    }
    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    .error {
      min-height: 20px;
      color: var(--danger);
      font-size: 13px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="eyebrow">Denis Martín Barroso</div>
    <h1>Dashboard protegido</h1>
    <p>Introduce tu usuario y contraseña para acceder al visualizador de inversión y patrimonio.</p>
    <form id="loginForm">
      <input type="hidden" id="nextInput" name="next" value="/">
      <label>
        Usuario
        <input id="usernameInput" name="username" type="text" autocomplete="username" required>
      </label>
      <label>
        Contraseña
        <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="submitButton" type="submit">Entrar</button>
      <div class="error" id="errorMessage"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('nextInput').value = params.get('next') || '/';
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('submitButton');
      const error = document.getElementById('errorMessage');
      button.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('usernameInput').value,
            password: document.getElementById('passwordInput').value,
            next: document.getElementById('nextInput').value,
          }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'No se pudo iniciar sesión.');
        }
        window.location.href = payload.next || '/';
      } catch (err) {
        error.textContent = err.message || 'No se pudo iniciar sesión.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
